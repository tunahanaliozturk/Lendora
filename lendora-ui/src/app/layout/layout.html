<!-- Sidebar -->
<aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col z-50">

  <!-- Brand -->
  <div class="h-16 flex items-center px-6 border-b border-slate-700/50 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center shrink-0">
        <span class="text-white font-bold text-sm leading-none">L</span>
      </div>
      <span class="text-lg font-semibold tracking-tight text-white">Lendora</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">

    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-slate-800 text-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium group"
      aria-label="Dashboard"
    >
      <!-- Grid / squares icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 shrink-0 text-slate-400 group-hover:text-white transition-colors"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"
        />
      </svg>
      <span>Dashboard</span>
    </a>

    <!-- Applications -->
    <a
      routerLink="/applications"
      routerLinkActive="bg-slate-800 text-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium group"
      aria-label="Applications"
    >
      <!-- Document text icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 shrink-0 text-slate-400 group-hover:text-white transition-colors"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
        />
      </svg>
      <span>Applications</span>
    </a>

    <!-- Loans -->
    <a
      routerLink="/loans"
      routerLinkActive="bg-slate-800 text-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium group"
      aria-label="Loans"
    >
      <!-- Banknotes icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 shrink-0 text-slate-400 group-hover:text-white transition-colors"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"
        />
      </svg>
      <span>Loans</span>
    </a>

    <!-- Payments -->
    <a
      routerLink="/payments"
      routerLinkActive="bg-slate-800 text-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium group"
      aria-label="Payments"
    >
      <!-- Credit card icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 shrink-0 text-slate-400 group-hover:text-white transition-colors"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z"
        />
      </svg>
      <span>Payments</span>
    </a>

  </nav>

  <!-- Footer -->
  <div class="px-6 py-4 border-t border-slate-700/50 shrink-0">
    <p class="text-xs text-slate-500">v1.0.0</p>
  </div>

</aside>

<!-- Global toast notifications — rendered outside main so z-50 clears everything -->
<app-toast />

<!-- Main content -->
<main class="ml-64 min-h-screen flex flex-col bg-surface-secondary">

  <!-- Top bar -->
  <header class="h-16 bg-white border-b border-border flex items-center px-8 sticky top-0 z-40 shrink-0 shadow-sm">
    <h1 class="text-lg font-semibold text-text-primary">{{ pageTitle() }}</h1>
  </header>

  <!-- Page content -->
  <div class="flex-1 p-8">
    <router-outlet />
  </div>

</main>
